<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFIGRAPH TECHNOLOGIES // CYBER OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060814;
            --bg-panel: rgba(13, 17, 34, 0.88);
            --bg-card: rgba(20, 26, 50, 0.9);
            --fg-white: #ffffff;
            --fg-main: #f1f5f9;
            --fg-secondary: #cbd5e1;
            --fg-muted: #94a3b8;
            
            /* Dynamic Theme Colors (Default: Cyber Neon) */
            --accent-1: #00f2fe; /* Electric Cyan */
            --accent-2: #a855f7; /* Neon Purple */
            --accent-3: #ec4899; /* Hot Pink */
            --accent-green: #10b981; /* Emerald */
            --border-glow: rgba(0, 242, 254, 0.35);
        }

        /* Theme 2: Matrix Emerald */
        body.theme-matrix {
            --accent-1: #10b981;
            --accent-2: #06b6d4;
            --accent-3: #84cc16;
            --border-glow: rgba(16, 185, 129, 0.35);
        }

        /* Theme 3: Sunset Synthwave */
        body.theme-sunset {
            --accent-1: #f43f5e;
            --accent-2: #f97316;
            --accent-3: #eab308;
            --border-glow: rgba(244, 63, 94, 0.35);
        }

        /* Theme 4: Royal Gold */
        body.theme-gold {
            --accent-1: #fbbf24;
            --accent-2: #38bdf8;
            --accent-3: #f59e0b;
            --border-glow: rgba(251, 191, 36, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--fg-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            line-height: 1.65;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease;
        }

        /* Dynamic Glowing Orbs Behind Canvas */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.22;
            z-index: 0;
            pointer-events: none;
            transition: background 0.6s ease;
        }
        .orb-1 { top: -100px; left: -100px; background: var(--accent-1); }
        .orb-2 { bottom: -100px; right: -100px; background: var(--accent-2); }

        /* Interactive Particle Network Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Top OS Taskbar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(6, 8, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .os-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--fg-white);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.6; }
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 18px;
            color: var(--fg-secondary);
        }

        .theme-btn {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .theme-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px var(--accent-1);
        }

        /* Main Desktop Workspace */
        .desktop-workspace {
            position: relative;
            z-index: 10;
            max-width: 1180px;
            margin: 72px auto 40px auto;
            padding: 16px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        /* Terminal Window Styling */
        .window {
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
        }

        .window:hover {
            border-color: var(--accent-1);
            box-shadow: 0 15px 40px var(--border-glow);
        }

        .window-header {
            background: rgba(8, 11, 24, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-1);
        }

        /* Mac/Linux Colorful Window Dots */
        .window-controls {
            display: flex;
            gap: 8px;
        }

        .win-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff5f56; box-shadow: 0 0 6px #ff5f56; }
        .dot-yellow { background: #ffbd2e; box-shadow: 0 0 6px #ffbd2e; }
        .dot-green { background: #27c93f; box-shadow: 0 0 6px #27c93f; }

        .window-body {
            padding: 28px;
        }

        /* Hero Gradient Title */
        .hero-badge {
            display: inline-block;
            background: rgba(0, 242, 254, 0.12);
            border: 1px solid var(--accent-1);
            color: var(--accent-1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .hero-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff 0%, var(--accent-1) 50%, var(--accent-2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--fg-secondary);
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 24px;
            border-left: 3px solid var(--accent-2);
            padding-left: 14px;
        }

        /* Terminal Log Area */
        .terminal-output {
            background: rgba(5, 7, 15, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 18px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.75;
            margin-bottom: 16px;
            color: var(--fg-main);
            max-height: 260px;
            overflow-y: auto;
        }

        .prompt-line {
            margin-bottom: 8px;
        }

        .prompt-user {
            color: var(--accent-1);
            font-weight: 700;
        }

        .tag-ok {
            color: var(--accent-green);
            font-weight: 700;
        }

        /* Quick Command Pills */
        .quick-cmds {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
        }

        .quick-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--fg-muted);
            margin-right: 4px;
        }

        .cmd-chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--fg-white);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cmd-chip:hover {
            background: var(--accent-1);
            color: #000;
            border-color: var(--accent-1);
            font-weight: 700;
            transform: translateY(-1px);
        }

        /* Interactive Command Line */
        .cli-input-wrap {
            display: flex;
            align-items: center;
            background: #04060e;
            border: 1px solid var(--accent-1);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.12);
        }

        .cli-prefix {
            color: var(--accent-2);
            font-weight: 700;
            margin-right: 12px;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        #cli-input {
            background: transparent;
            border: none;
            color: var(--fg-white);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        #cli-input::placeholder {
            color: var(--fg-muted);
        }

        /* Services / Modules Grid */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 20px;
        }

        .module-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-card);
            border-radius: 8px;
            padding: 22px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        }

        .module-card:hover {
            border-color: var(--accent-1);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .module-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--accent-1);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .module-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--fg-white);
            margin-bottom: 10px;
        }

        .module-desc {
            font-size: 0.95rem;
            color: var(--fg-secondary);
            line-height: 1.6;
        }

        /* Bottom 2-Column Grid */
        .grid-2col {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
        }

        /* Contact Section & Buttons */
        .contact-list {
            list-style: none;
            margin-bottom: 24px;
        }

        .contact-list li {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            color: var
