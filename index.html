<html lang="en">
<head>
    <meta charset="UTF-8">

        :root {
            --bg-dark: #070913;
            --bg-panel: #101528;
            --bg-card: #161d36;
            --fg-white: #ffffff;
            --fg-main: #f1f5f9;
            --fg-secondary: #cbd5e1;
            --fg-muted: #94a3b8;
            --accent-1: #00f2fe;
            --accent-2: #a855f7;
            --accent-3: #ec4899;
            --accent-green: #10b981;
            --border-color: #263159;
        }

        body.theme-matrix {
            --accent-1: #10b981;
            --accent-2: #06b6d4;
            --accent-3: #84cc16;
            --border-color: #14532d;
        }

        body.theme-sunset {
            --accent-1: #ff5e7e;
            --accent-2: #ff9900;
            --accent-3: #eab308;
            --border-color: #5b2133;
        }

        body.theme-gold {
            --accent-1: #fbbf24;
            --accent-2: #38bdf8;
            --accent-3: #f59e0b;
            --border-color: #574115;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #070913;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            color: var(--fg-main);
            font-family: 'Inter', Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.65;
            font-size: 16px;
        }

        /* Particle Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Top OS Taskbar */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #04060d;
            border-bottom: 2px solid var(--accent-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .os-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: #ffffff;
        }
